
#####################################################################
# CLEAN NOZZLE - VORON TRIDENT 350 / KALICO
#####################################################################
# Rear-mounted nozzle brush
#
# Default: 5 wipe cycles
# Fast:    CLEAN_NOZZLE WIPES=3
# Normal:  CLEAN_NOZZLE
# Deep:    CLEAN_NOZZLE WIPES=10
#
# Preserves current nozzle temperature.
# Does not automatically heat the nozzle.
#####################################################################

[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle on rear brush with adjustable wipes

variable_start_x: 92.50
variable_start_y: 357.10
variable_start_z: 1.00

variable_wipe_dist_x: 45.0
variable_wipe_speed: 50
variable_wipe_count: 5
variable_raise_distance: 10.0
variable_min_clean_temp: 150

gcode:
    # ---------------------------------------------------------
    # Read settings and optional parameters
    # ---------------------------------------------------------
    {% set macro = printer["gcode_macro CLEAN_NOZZLE"] %}

    {% set sx = macro.start_x|float %}
    {% set sy = macro.start_y|float %}
    {% set sz = macro.start_z|float %}
    {% set dx = macro.wipe_dist_x|float %}
    {% set speed = macro.wipe_speed|float * 60 %}
    {% set lift = macro.raise_distance|float %}
    {% set min_temp = macro.min_clean_temp|float %}

    {% set requested = params.WIPES|default(macro.wipe_count)|int %}
    {% set wipes = [[requested, 1]|max, 10]|min %}

    {% set actual_temp = printer.extruder.temperature|float %}
    {% set safe_z = [10.0, sz + lift]|max %}

    # ---------------------------------------------------------
    # Check nozzle temperature
    # ---------------------------------------------------------
    {% if actual_temp < min_temp %}

        RESPOND TYPE=error MSG="Nozzle too cold for cleaning"
        RESPOND TYPE=echo MSG="Heat nozzle to at least 150C"
        SET_DISPLAY_TEXT MSG="Nozzle Too Cold"

    {% else %}

        # -----------------------------------------------------
        # Home if needed
        # -----------------------------------------------------
        {% if "xyz" not in printer.toolhead.homed_axes %}
            SET_DISPLAY_TEXT MSG="Homing"
            G28
        {% endif %}

        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

        G90

        # -----------------------------------------------------
        # Raise nozzle before moving to brush
        # -----------------------------------------------------
        {% if printer.toolhead.position.z < safe_z %}
            G1 Z{safe_z} F1500
        {% endif %}

        # -----------------------------------------------------
        # Move to rear brush
        # -----------------------------------------------------
        SET_DISPLAY_TEXT MSG="Moving to Brush"

        G1 X{sx} Y{sy} F6000
        G1 Z{sz} F1200

        # -----------------------------------------------------
        # Perform cleaning cycles
        # -----------------------------------------------------
        SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
        STATUS_CLEANING

        {% for i in range(wipes) %}
            G1 X{sx + dx} F{speed}
            G1 X{sx} F{speed}
        {% endfor %}

        # -----------------------------------------------------
        # Lift clear of brush
        # -----------------------------------------------------
        G91
        G1 Z{lift} F1500
        G90

        # -----------------------------------------------------
        # Restore previous G-code movement state
        # -----------------------------------------------------
        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

        SET_DISPLAY_TEXT MSG="Nozzle Clean"
        RESPOND TYPE=echo MSG="Nozzle cleaning complete"

    {% endif %}
