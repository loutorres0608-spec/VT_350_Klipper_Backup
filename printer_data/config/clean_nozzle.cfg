#####################################################################
#   CLEAN NOZZLE
#####################################################################

[gcode_macro CLEAN_NOZZLE]
description: Scrub nozzle on rear brush - no heat required

variable_start_x: 92.50
variable_start_y: 357.10
variable_start_z: 1.00

variable_wipe_dist_x: 40.0
variable_wipe_speed: 50
variable_wipe_count: 5
variable_raise_distance: 10.0

gcode:
    {% set macro = printer["gcode_macro CLEAN_NOZZLE"] %}

    {% set sx = macro.start_x|float %}
    {% set sy = macro.start_y|float %}
    {% set sz = macro.start_z|float %}
    {% set dx = macro.wipe_dist_x|float %}
    {% set speed = macro.wipe_speed|float * 60 %}
    {% set wipes = macro.wipe_count|int %}
    {% set lift = macro.raise_distance|float %}

    # Home if necessary
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90

    # Raise to safe travel height if needed
    {% if printer.toolhead.position.z < 10 %}
        G1 Z10 F1500
    {% endif %}

    # Move above brush
    SET_DISPLAY_TEXT MSG="Moving to Brush"
    G1 X{sx} Y{sy} F6000

    # Lower onto brush
    G1 Z{sz} F1200

    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    STATUS_CLEANING

    # Wipe X92.5 <-> X122.5
    {% for i in range(wipes) %}
        G1 X{sx + dx} F{speed}
        G1 X{sx} F{speed}
    {% endfor %}

    # Lift clear
    G91
    G1 Z{lift} F1500
    G90

    SET_DISPLAY_TEXT MSG="Nozzle Clean"
    RESPOND TYPE=echo MSG="Nozzle cleaning complete"