#####################################################################
#   PURGE NOZZLE
#####################################################################

[gcode_macro PURGE_NOZZLE]
description: Move over purge bucket, heat to filament temp and purge

variable_purge_x: 83.50
variable_purge_y: 361.60
variable_purge_z: 0.50
variable_safe_z: 10.0

variable_purge_length: 20.0
variable_purge_speed: 5.0

variable_retract_length: 2.0
variable_retract_speed: 30.0

gcode:
    {% set macro = printer["gcode_macro PURGE_NOZZLE"] %}

    {% set px = macro.purge_x|float %}
    {% set py = macro.purge_y|float %}
    {% set pz = macro.purge_z|float %}
    {% set safe_z = macro.safe_z|float %}

    {% set purge_len = macro.purge_length|float %}
    {% set purge_speed = macro.purge_speed|float * 60 %}
    {% set retract = macro.retract_length|float %}
    {% set retract_speed = macro.retract_speed|float * 60 %}

    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% set purge_temp = params.TEMP|default(printer.extruder.target)|float %}

    # Must have a valid extrusion temperature
    {% if purge_temp < min_temp %}
        { action_raise_error(
            "PURGE_NOZZLE requires TEMP=xxx or an active hotend target"
        ) }
    {% endif %}

    # Home if necessary
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=STATE_PURGE_NOZZLE

    G90

    # Safe Z
    {% if printer.toolhead.position.z < safe_z %}
        G1 Z{safe_z} F1500
    {% endif %}

    # IMPORTANT:
    # Move to bucket BEFORE heating to full filament temperature
    SET_DISPLAY_TEXT MSG="Moving to Purge Bucket"
    G1 X{px} Y{py} F9000
    G1 Z{pz} F1200

    # Now heat over bucket
    SET_DISPLAY_TEXT MSG="Heating Nozzle {purge_temp|int}C"
    STATUS_HEATING

    M109 S{purge_temp}

    # Purge
    SET_DISPLAY_TEXT MSG="Purging Nozzle"

    M83
    G1 E{purge_len} F{purge_speed}

    # Retract to reduce stringing
    G1 E-{retract} F{retract_speed}

    M400

    RESPOND TYPE=echo MSG="Purged {purge_len|round(1)}mm at {purge_temp|int}C"

    RESTORE_GCODE_STATE NAME=STATE_PURGE_NOZZLE