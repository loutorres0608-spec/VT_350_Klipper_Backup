######################################################################
# Filament Change
######################################################################

[pause_resume]


[gcode_macro M600]
description: Pause print, park toolhead, unload filament, and wipe nozzle
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(20)|float %}
    {% set Z = params.Z|default(10)|float %}

    SET_DISPLAY_TEXT MSG="Filament Change"
    M117 Filament Change

    # Pause print
    PAUSE

    # Small retract and Z lift
    G91
    G1 E-1.0 F1800
    G1 Z{Z} F1200

    # Move to filament change position
    G90
    G1 X{X} Y{Y} F6000

    # Unload filament
    G91
    G1 E-5 F600
    G1 E-50 F1800
    G90

    # First wipe - clean old filament from nozzle
    SET_DISPLAY_TEXT MSG="Wiping Nozzle"
    M117 Wiping Nozzle
    CLEAN_NOZZLE

    # Wait for user to insert new filament
    SET_DISPLAY_TEXT MSG="Load New Filament"
    M117 Load New Filament
    RESPOND TYPE=echo MSG="Insert new filament, then run LOAD_FILAMENT."


######################################################################
# Load New Filament
######################################################################

[gcode_macro LOAD_FILAMENT]
description: Load filament, purge, wipe nozzle, then wait for manual resume
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}

        SET_DISPLAY_TEXT MSG="Loading Filament"
        M117 Loading Filament

        # Load filament
        G91
        G1 E40 F600

        # Slow purge
        SET_DISPLAY_TEXT MSG="Purging Filament"
        M117 Purging Filament
        G1 E20 F120
        G90

        # Second wipe - remove purge from nozzle
        SET_DISPLAY_TEXT MSG="Final Nozzle Wipe"
        M117 Final Nozzle Wipe
        CLEAN_NOZZLE

        # DO NOT automatically resume
        SET_DISPLAY_TEXT MSG="Ready - Press Resume"
        M117 Ready - Press Resume
        RESPOND TYPE=echo MSG="Filament loaded and nozzle cleaned. Press RESUME when ready."

    {% else %}

        SET_DISPLAY_TEXT MSG="Hotend Too Cold"
        M117 Hotend Too Cold
        RESPOND TYPE=error MSG="Hotend is not hot enough to load filament."

    {% endif %}