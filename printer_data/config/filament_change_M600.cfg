######################################################################
# Filament Change
######################################################################

[pause_resume]


[gcode_macro M600]
description: Pause print, park toolhead, unload filament, and wipe nozzle
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(20)|float %}
    {% set Z = params.Z|default(10)|float %}

    SET_DISPLAY_TEXT MSG="Filament Change"
    M117 Filament Change

    # Pause and preserve print position
    PAUSE

    # Small retract
    G91
    G1 E-1.0 F1800

    # Lift away from the part
    G1 Z{Z} F1200

    # Move to filament-change position
    G90
    G1 X{X} Y{Y} F6000

    # Unload filament
    G91
    G1 E-5 F600
    G1 E-50 F1800
    G90

    # Wipe nozzle before loading new filament
    SET_DISPLAY_TEXT MSG="Wiping Nozzle"
    M117 Wiping Nozzle
    CLEAN_NOZZLE

    # Stay paused and wait for user
    SET_DISPLAY_TEXT MSG="Load Filament - Then Resume"
    M117 Load Filament Then Resume