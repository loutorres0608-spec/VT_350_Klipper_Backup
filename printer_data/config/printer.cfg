
# This file contains common pin mappings for the BigTreeTech Octopus
# Pro v1.1 board.

# Important! Do not use this config with an Octopus Pro v1.0 board nor
# non-Pro board.

# To use this config, during "make menuconfig", select "Enable
# low-level configuration options", select the STM32H723
# micro-controller, select a "128KiB bootloader", and select a "25Mhz
# crystal".

# See docs/Config_Reference.md for a description of parameters.

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Hotend heater pin                    [extruder] section
## Leadscrew Rotation Distance          [stepper_z], [stepper_z1], [stepper_z2]
## Z Endstop Switch location            [safe_z_home] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Stepper Z1 enable pin                [
## section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section


[include mainsail.cfg]
[include Btt_eb2209_rp2040.cfg]
[include stealthburner_leds.cfg]
[include gantry_nozzle_scrub.cfg]
[include service_position.cfg]
[include ADAPTIVE_PURGE.cfg]
[include SHAPER_CALIBRATE.cfg]
[include belt_tension_position.cfg]
[include led_effects.cfg]


#####################################################################
#   Exclude Object / Adaptive Mesh
#####################################################################

[exclude_object]

#####################################################################
#   Danger Klipper Options
#####################################################################

[danger_options]
multi_mcu_trsync_timeout: 0.050
endstop_sample_count: 2

#####################################################################
#   MCU/Canbus/Printer Settings
#####################################################################

[mcu]

canbus_uuid: 1eeec47560fd

##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
#serial: /dev/serial/by-id/usb-katapult_stm32h723xx_0C0014000651313433343333-if00
#restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 350           #400
max_accel: 9000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 400
square_corner_velocity: 10.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to EBBCan:gpio24
[stepper_x]
step_pin: PF13
dir_pin:  !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: EBBCan:gpio24
position_min: 0
##--------------------------------------------------------------------

##  Uncomment below for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 353 #old value 353 
position_max: 353 #old value 353

##--------------------------------------------------------------------
homing_speed: 60   #Max 100
second_homing_speed: 30
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to PG9
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:  PG9
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 250mm build
#position_endstop: 250
#position_max: 250

##  Uncomment for 300mm build
#position_endstop: 300
#position_max: 300

##  Uncomment for 350mm build
position_endstop: 361.9 #old value 361.9
position_max: 361.9 #old value 361.9

##--------------------------------------------------------------------
homing_speed: 90  #Max 100
second_homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to EBBCan:gpio22
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4    
microsteps: 32
endstop_pin: probe:z_virtual_endstop
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
## All builds use same Max Z
position_max: 230
position_min: -4.5
homing_speed: 8.0 # Leadscrews are slower than 2.4, 10 is a recommended max.
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Center
##  Connected to MOTOR_5
[stepper_z1]
step_pin: PC13
dir_pin: PF0
## Octopus 1.0 & 1.1.  Octopus PRO 1.0
enable_pin: !PF1
## Octopus PRO 1.1
#enable_pin: !PA2
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Front Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
# Rotation Distance for TR8x8 = 8, TR8x4 = 4, TR8x2 = 2
rotation_distance: 4  
microsteps: 32

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: False
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3

max_power: 0.6

pwm_cycle_time: 0.02088  # 44.9 Hz - reduces mains light flicker try this if flickering continues: pwm_cycle_time: 0.02088 old:0.02227 


min_temp: 0
max_temp: 110

control: pid
pid_kp: 39.880
pid_ki: 1.228
pid_kd: 323.779

#####################################################################
#   Probe
#####################################################################

[probe]

##  Inductive Probe


##  This probe is not used for Z height, only Quad Gantry Leveling

# Select the probe port by type:
## For the PROBE port. Will not work with Diode. May need pull-up resistor from signal to 24V.
#pin: ~!PB7
## For the DIAG_7 port. NEEDS BAT85 DIODE! Change to !PG15 if probe is NO.
#pin: PG15
## For Octopus Pro Probe port; NPN and PNP proximity switch types can be set by jumper
#pin: ~!PC5
pin: !EBBCan:gpio22
#--------------------------------------------------------------------

x_offset: 0
y_offset: 0
#z_offset: -0.650
speed: 8.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.015
samples_tolerance_retries: 3

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
        {% endif %}

#####################################################################
#   Filament Runout and Encoder Sensors
#####################################################################

[filament_switch_sensor RUNOUT]
switch_pin: PG12
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5

runout_gcode:
    M117 Out of Filament
    RESPOND TYPE=error MSG="FILAMENT RUNOUT - Load filament, purge, then press RESUME."

insert_gcode:
    M117 Filament Loaded
    RESPOND TYPE=echo MSG="Filament detected. Load/purge filament, then manually press RESUME."

[filament_motion_sensor encoder_sensor]
switch_pin: ^PG13
detection_length: 10.0
extruder: extruder
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5

runout_gcode:
    M117 Filament Motion Stopped
    RESPOND TYPE=error MSG="FILAMENT MOTION STOPPED - Check filament path, load/purge, then press RESUME."

#####################################################################
#   Fan Control
#####################################################################

[fan_generic Rear_Exhaust_fan]
## Exhaust fan - FAN4 ## Cabient filter exhaust fan
## Adjust if you use a different board or a different terminal.
pin: PD14
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 1.0

[fan_generic Nevermore_fan]
##  Exhaust Fan - FAN1 Nevermore
##  If you are experiencing back flow, you can reduce fan_speed
pin: PA8

#[fan_generic Bottom_Skirt_fan_1] ***use this when performing Input Shaper**
[controller_fan Bottom_Skirt_fan_1]
## Controller fan - FAN2
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
stepper: stepper_x, stepper_y, stepper_z
idle_timeout: 5


[heater_fan Bottom_Skirt_fan_2]
##  Exhaust fan - FAN3
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 50
fan_speed: 1.0


#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
##Octopus PRO 1.1
pin: PB0
pwm:true
shutdown_value: 0
value: 0.5
cycle_time: 0.0001

[neopixel GRBW_LED_Strips]  # Replace "your_led_name" with a descriptive name for your LEDs
pin: PB10
#   The pin connected to the neopixel. This parameter must be
#   provided.
chain_count: 36
#   The number of Neopixel chips that are chained together. This
#   parameter must be provided.
color_order: GRBW
#   Set the pixel order (e.g. RGB, GRB, BRG, ...). This generally
#   depends on the specific LED strip being used. The default is
#   GRB.
initial_RED:   1.0
initial_GREEN: 1.0
initial_BLUE:  1.0
initial_WHITE: 1.0
#   The initial color of the Neopixel. Each value should be between
#   0.0 and 1.0. The default is all zeros (off).

