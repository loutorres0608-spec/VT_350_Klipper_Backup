################################################
# TMC AUTOTUNE CONFIG
################################################

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
tuning_goal: performance

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
tuning_goal: performance

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: auto

[auto_speed]
axis: diag_x, diag_y

margin: 20
settling_home: 1
max_missed: 1.0
endstop_samples: 3

accel_min: 3000
accel_max: 12000
accel_accu: 0.05

velocity_min: 150
velocity_max: 450
velocity_accu: 0.05

derate: 0.8
results_dir: ~/printer_data/config

