#####################################################################
#   Macros
#####################################################################

[gcode_macro RUN_TMC_AUTOTUNE]
description: Run TMC autotune on all motors
gcode:

    AUTOTUNE_TMC STEPPER=stepper_x

    AUTOTUNE_TMC STEPPER=stepper_y

    AUTOTUNE_TMC STEPPER=extruder
    
[gcode_macro PID_EXTRUDER] description: PID Tune for the Extruder gcode:
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(210)|float %}
  PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS

[gcode_macro PID_BED] description: PID Tune for the Bed gcode:
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %}
  PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS

[gcode_macro BLUE_LEDS]
gcode:
 SET_LED LED="GRBW_LED_Strips" RED=0.4039 GREEN=0.1294 BLUE=1.0 WHITE=0.0 SYNC=0 TRANSMIT=1 #turns the leds blue

[gcode_macro RED_LEDS]
gcode:
 SET_LED LED="GRBW_LED_Strips" RED=1.0 GREEN=0.0 BLUE=0.0 WHITE=0.0 SYNC=0 TRANSMIT=1 #turns the leds red

[gcode_macro ORANGE_LEDS]
gcode:
 SET_LED LED="GRBW_LED_Strips" RED=1.0 GREEN=0.1647 BLUE=0.0 WHITE=0.0 SYNC=0 TRANSMIT=1 #turns the leds orange
 
[gcode_macro PURPLE_LEDS]
gcode:
 SET_LED LED="GRBW_LED_Strips" RED=1.0 GREEN=0.0 BLUE=0.5882 WHITE=0.0 SYNC=0 TRANSMIT=1 #turns the leds purple

[gcode_macro PARK_TOOLHEAD]
gcode:
  {% set X_POS = 350 %} ; Your desired X park position (e.g., near tool changer)
  {% set Y_POS = 350 %} ; Your desired Y park position (back of bed)
  G90 ; Absolute positioning
  G1 Z10 F600 ; Lift nozzle
  G1 X{X_POS} Y{Y_POS} F3000 ; Move to park

[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgling: False
variable_heating_nozzle: False
variable_heating_bed: False
gcode:

[gcode_macro M109]
rename_existing: M109.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
    M109.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
    M190.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28.1 {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    BTT_BED_MESH_CALIBRATE
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False

[gcode_macro Z_TILT_ADJUST]
rename_existing: BTT_Z_TILT_ADJUST
gcode:
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
    BTT_Z_TILT_ADJUST {rawparams}
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False


#####################################################################
#   PRINT START Macro
#####################################################################

[gcode_macro PRINT_START]
description: Trident R2 startup - heat, conditional soak, Z tilt, adaptive mesh, clean and purge
gcode:

    # ---------------------------------------------------------
    # Slicer parameters / startup state
    # ---------------------------------------------------------
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("45")|int %}
    {% set bed_start_temp = printer.heater_bed.temperature|float %}

    # Physical bed center
    {% set x_wait = 175.0 %}
    {% set y_wait = 175.10 %}


    # ---------------------------------------------------------
    # Begin heating
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}C"
    SET_LED_EFFECT EFFECT=heating_effect REPLACE=1

    M140 S{target_bed}
    M104 S150


    # ---------------------------------------------------------
    # Initial home
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Homing"
    STATUS_HOMING
    SET_LED_EFFECT EFFECT=homing_effect REPLACE=1

    G28

    G90
    G1 X{x_wait} Y{y_wait} Z15 F9000


    # ---------------------------------------------------------
    # Wait for bed
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}C"
    SET_LED_EFFECT EFFECT=heating_effect REPLACE=1

    M190 S{target_bed}


    # ---------------------------------------------------------
    # Conditional heat soak
    #
    # High-temp (>90C):
    #   Skip if bed started >=75C
    #
    # Normal-temp (<=90C):
    #   Skip if bed started >=50C
    # ---------------------------------------------------------
    {% if target_bed > 90 %}

        {% if bed_start_temp >= 75 %}

            SET_DISPLAY_TEXT MSG="Bed Warm - Skip Soak"
            RESPOND TYPE=echo MSG="Bed started at {bed_start_temp|round(1)}C - high-temp soak skipped"

        {% else %}

            SET_DISPLAY_TEXT MSG="High Temp Soak - 5 min"
            G4 P300000

        {% endif %}

    {% else %}

        {% if bed_start_temp >= 50 %}

            SET_DISPLAY_TEXT MSG="Bed Warm - Skip Soak"
            RESPOND TYPE=echo MSG="Bed started at {bed_start_temp|round(1)}C - normal soak skipped"

        {% else %}

            SET_DISPLAY_TEXT MSG="Bed Soak - 3.5 min"
            G4 P210000

        {% endif %}

    {% endif %}


    # ---------------------------------------------------------
    # Bring hotend to probing temperature
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Hotend: 150C"
    STATUS_HEATING
    SET_LED_EFFECT EFFECT=heating_effect REPLACE=1

    M109 S150


    # ---------------------------------------------------------
    # Z Tilt
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Z-Tilt Adjust"
    STATUS_LEVELING
    SET_LED_EFFECT EFFECT=leveling_effect REPLACE=1

    Z_TILT_ADJUST


    # ---------------------------------------------------------
    # Re-home Z
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Re-Homing Z"
    STATUS_HOMING
    SET_LED_EFFECT EFFECT=homing_effect REPLACE=1

    G28 Z


    # ---------------------------------------------------------
    # Adaptive bed mesh
    # ---------------------------------------------------------
    BED_MESH_CLEAR

    SET_DISPLAY_TEXT MSG="Adaptive Bed Mesh"
    STATUS_MESHING
    SET_LED_EFFECT EFFECT=meshing_effect REPLACE=1

    BTT_BED_MESH_CALIBRATE ADAPTIVE=1


    # ---------------------------------------------------------
    # Return to bed center
    # ---------------------------------------------------------
    G90
    G1 X{x_wait} Y{y_wait} Z15 F9000


    # ---------------------------------------------------------
    # Heat hotend to print temperature
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}C"
    STATUS_HEATING
    SET_LED_EFFECT EFFECT=heating_effect REPLACE=1

    M109 S{target_extruder}


    # ---------------------------------------------------------
    # Final nozzle clean
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
    STATUS_CLEANING
    SET_LED_EFFECT EFFECT=cleaning_effect REPLACE=1

    CLEAN_NOZZLE


    # ---------------------------------------------------------
    # Adaptive purge
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Adaptive Purge"
    STATUS_PRINTING
    SET_LED_EFFECT EFFECT=printing_effect REPLACE=1

    ADAPTIVE_PURGE


    # ---------------------------------------------------------
    # Printing state
    # ---------------------------------------------------------
    SET_FAN_SPEED FAN=Rear_Exhaust_fan SPEED=0.80

    STATUS_PRINTING
    SET_LED_EFFECT EFFECT=printing_effect REPLACE=1

    SET_DISPLAY_TEXT MSG="Print Started"
    M117 Print Started

#####################################################################
#   LOAD FILAMENT
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Load filament, purge, wipe nozzle, then wait for manual resume
gcode:

    {% if printer.extruder.can_extrude|lower == 'true' %}

        SAVE_GCODE_STATE NAME=load_filament_state

        SET_DISPLAY_TEXT MSG="Loading Filament"
        M117 Loading Filament

        # Relative extrusion
        M83

        # Feed filament toward hotend
        G1 E40 F600

        # Slow purge through nozzle
        SET_DISPLAY_TEXT MSG="Purging Filament"
        M117 Purging Filament

        G1 E20 F120

        RESTORE_GCODE_STATE NAME=load_filament_state MOVE=0


        # -----------------------------------------------------
        # Second wipe after new filament purge
        # -----------------------------------------------------
        SET_DISPLAY_TEXT MSG="Final Nozzle Wipe"
        STATUS_CLEANING
        M117 Final Nozzle Wipe

        CLEAN_NOZZLE


        # -----------------------------------------------------
        # Stay paused - user decides when to resume
        # -----------------------------------------------------
        SET_DISPLAY_TEXT MSG="Ready - Press Resume"
        M117 Ready - Press Resume

        RESPOND TYPE=echo MSG="Filament loaded, purged and wiped. Inspect nozzle, then press RESUME."

    {% else %}

        SET_DISPLAY_TEXT MSG="Hotend Too Cold"
        M117 Hotend Too Cold

        RESPOND TYPE=error MSG="Hotend is not hot enough to load filament."

    {% endif %}


#####################################################################
#   UNLOAD FILAMENT
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Retract and unload filament from extruder
gcode:

    {% if printer.extruder.can_extrude|lower == 'true' %}

        SAVE_GCODE_STATE NAME=unload_filament_state

        SET_DISPLAY_TEXT MSG="Unloading Filament"
        M117 Unloading Filament

        M83

        # Small forward extrusion before retracting
        G1 E5 F300

        # Pull filament from hotend
        G1 E-55 F1200

        RESTORE_GCODE_STATE NAME=unload_filament_state MOVE=0

        SET_DISPLAY_TEXT MSG="Filament Unloaded"
        M117 Filament Unloaded

    {% else %}

        SET_DISPLAY_TEXT MSG="Hotend Too Cold"
        M117 Hotend Too Cold

        RESPOND TYPE=error MSG="Hotend is not hot enough to unload filament."

    {% endif %}


#####################################################################
#   M600 FILAMENT CHANGE
#####################################################################

[gcode_macro M600]
description: Pause print, unload filament, wipe nozzle, and wait for user
gcode:

    SET_DISPLAY_TEXT MSG="Filament Change"
    M117 Filament Change

    # ---------------------------------------------------------
    # Pause print - RESUME will restore print position later
    # ---------------------------------------------------------
    PAUSE


    # ---------------------------------------------------------
    # Move away from print
    # ---------------------------------------------------------
    G91
    G1 Z10 F1200

    G90
    G1 X50 Y20 F6000


    # ---------------------------------------------------------
    # Unload old filament
    # ---------------------------------------------------------
    UNLOAD_FILAMENT


    # ---------------------------------------------------------
    # First nozzle wipe
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Wiping Old Filament"
    STATUS_CLEANING
    M117 Wiping Old Filament

    CLEAN_NOZZLE


    # ---------------------------------------------------------
    # Wait indefinitely for user
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Insert New Filament"
    M117 Insert New Filament

    RESPOND TYPE=echo MSG="Insert new filament, then run LOAD_FILAMENT. Press RESUME only after loading, purging and wiping."

#####################################################################
#   PRINT END
#####################################################################

[gcode_macro PRINT_END]
description: End print, retract, cool, final nozzle clean and rear park
gcode:

    # ---------------------------------------------------------
    # Toolhead / safe positions
    # ---------------------------------------------------------
    {% set th = printer.toolhead %}

    {% set x_safe = th.position.x + 20 *
        (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}

    {% set y_safe = th.position.y + 20 *
        (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}

    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}


    # ---------------------------------------------------------
    # Finish queued moves and save state
    # ---------------------------------------------------------
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400


    # ---------------------------------------------------------
    # Initial retract
    # ---------------------------------------------------------
    {% if printer.extruder.can_extrude|lower == 'true' %}

        M83
        G1 E-3.0 F1800

    {% endif %}


    # ---------------------------------------------------------
    # Lift and move away from print
    # ---------------------------------------------------------
    G90
    G1 Z{z_safe} F1200
    G0 X{x_safe} Y{y_safe} F10000


    # ---------------------------------------------------------
    # Deep retract
    #
    # 3mm initial + 12mm additional = 15mm total
    # ---------------------------------------------------------
    {% if printer.extruder.can_extrude|lower == 'true' %}

        M83
        G1 E-12.0 F2400

    {% endif %}


    # ---------------------------------------------------------
    # Shut down heaters
    # ---------------------------------------------------------
    TURN_OFF_HEATERS


    # ---------------------------------------------------------
    # Brief cooling before final wipe
    # ---------------------------------------------------------
    M106 S255
    G4 P10000


    # ---------------------------------------------------------
    # Final nozzle clean
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Final Nozzle Clean"
    STATUS_CLEANING
    SET_LED_EFFECT EFFECT=cleaning_effect REPLACE=1

    CLEAN_NOZZLE

    M107


    # ---------------------------------------------------------
    # Rear park
    # ---------------------------------------------------------
    G90
    G0 X175 Y{th.axis_maximum.y - 2} F6000


    # ---------------------------------------------------------
    # Shut down exhaust
    # ---------------------------------------------------------
    SET_FAN_SPEED FAN=Rear_Exhaust_fan SPEED=0


    # ---------------------------------------------------------
    # Print complete indication
    # ---------------------------------------------------------
    SET_DISPLAY_TEXT MSG="Print Complete"
    M117 Print Complete

    SET_LED_EFFECT EFFECT=complete_effect REPLACE=1
    G4 P5000


    # ---------------------------------------------------------
    # Return LEDs to ready state
    # ---------------------------------------------------------
    STATUS_READY
    SET_LED_EFFECT EFFECT=ready_effect REPLACE=1


    # ---------------------------------------------------------
    # Restore G-code state
    # ---------------------------------------------------------
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

#####################################################################
#   CANCEL PRINT Macro
#####################################################################

[gcode_macro CANCEL_PRINT]
description: Safely cancel print, retract, lift, clean nozzle and park
rename_existing: CANCEL_PRINT_BASE
gcode:

    # ---------------------------------------------------------
    # Save current position/state
    # ---------------------------------------------------------
    {% set th = printer.toolhead %}

    {% set x_safe = th.position.x + 20 *
        (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}

    {% set y_safe = th.position.y + 20 *
        (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}

    {% set z_safe = [th.position.z + 5, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_CANCEL_PRINT

    M400


    # ---------------------------------------------------------
    # Retract immediately
    # ---------------------------------------------------------
    {% if printer.extruder.can_extrude|lower == 'true' %}

        M83
        G92 E0

        # Initial anti-string retract
        G1 E-3.0 F1800

    {% endif %}


    # ---------------------------------------------------------
    # Safely lift and move away from failed print
    # Only move if printer is homed
    # ---------------------------------------------------------
    {% if "xyz" in printer.toolhead.homed_axes %}

        G91
        G1 Z{z_safe - th.position.z} F1200
        G90

        G0 X{x_safe} Y{y_safe} F10000

    {% endif %}


    # ---------------------------------------------------------
    # Additional anti-ooze retract
    # Total retract = 12 mm
    # ---------------------------------------------------------
    {% if printer.extruder.can_extrude|lower == 'true' %}

        M83
        G1 E-9.0 F2400

    {% endif %}


    # ---------------------------------------------------------
    # Shut down heaters
    # ---------------------------------------------------------
    TURN_OFF_HEATERS


    # ---------------------------------------------------------
    # Cancel print in Klipper
    # ---------------------------------------------------------
    CANCEL_PRINT_BASE


    # ---------------------------------------------------------
    # Final nozzle cleaning
    #
    # Only attempt if XYZ is homed.
    # ---------------------------------------------------------
    {% if "xyz" in printer.toolhead.homed_axes %}

        SET_DISPLAY_TEXT MSG="Cleaning Nozzle"
        STATUS_CLEANING

        # Brief cooling period to reduce ooze
        M106 S255
        G4 P10000

        CLEAN_NOZZLE

        M107


        # -----------------------------------------------------
        # Rear park
        # -----------------------------------------------------
        G90
        G0 X175 Y{th.axis_maximum.y - 2} F6000

    {% endif %}


    # ---------------------------------------------------------
    # Shut down auxiliary fans
    # ---------------------------------------------------------
    M107

    SET_FAN_SPEED FAN=Rear_Exhaust_fan SPEED=0


    # ---------------------------------------------------------
    # Reset display / LEDs
    # ---------------------------------------------------------
    STATUS_READY

    SET_LED LED="GRBW_LED_Strips" RED=1.0 GREEN=1.0 BLUE=1.0 WHITE=1.0 SYNC=0 TRANSMIT=1

    SET_DISPLAY_TEXT MSG="Print Cancelled"
    M117 Print Cancelled


    # ---------------------------------------------------------
    # Restore G-code state
    # ---------------------------------------------------------
    RESTORE_GCODE_STATE NAME=STATE_CANCEL_PRINT

